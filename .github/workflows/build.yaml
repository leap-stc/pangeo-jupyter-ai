name: Build and push image

# Merges to main build the image and push it to quay.io, tagged with the
# short commit hash (e.g. quay.io/<org>/pangeo-jupyter-ai:1a2b3c4d5e6f).
on:
  push:
    branches:
      - main

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      # pangeo-notebook is ~1.7 GB compressed; free runner disk before building.
      - name: Free disk space
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc
          df -h

      - name: Checkout
        uses: actions/checkout@v4

      - name: Build and push to quay.io
        uses: jupyterhub/repo2docker-action@master
        with:
          DOCKER_USERNAME: ${{ secrets.QUAY_USERNAME }}
          DOCKER_PASSWORD: ${{ secrets.QUAY_PASSWORD }}
          DOCKER_REGISTRY: "quay.io"
          # Change to your quay.io org/repo.
          IMAGE_NAME: "sed2194/pangeo-jupyter-ai"
          # Commit-hash tags only; a moving 'latest' tag confuses the hub's image cache.
          LATEST_TAG_OFF: true

      - name: Disk usage after build
        run: df -h
